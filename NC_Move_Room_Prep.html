<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room-by-Room Sale Prep • NC Move</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e2937;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --green: #16a34a;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e2937 100%);
      color: var(--text);
      margin: 0;
      padding: 20px 16px 60px;
      line-height: 1.5;
      min-height: 100vh;
    }
    h1 {
      color: #67e8f9;
      text-align: center;
      margin: 0 0 6px;
      font-size: 1.6rem;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .top-bar {
      max-width: 720px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-secondary { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fda4af; }
    .btn-small { padding: 6px 12px; font-size: 0.85rem; }
    .summary {
      max-width: 720px;
      margin: 0 auto 24px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-around;
      text-align: center;
    }
    .summary strong { display: block; font-size: 1.4rem; color: #67e8f9; }
    .summary span { color: var(--muted); font-size: 0.85rem; }
    .room {
      max-width: 720px;
      margin: 0 auto 20px;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .room-header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      background: #1e2937;
    }
    .room-header h2 { margin: 0; font-size: 1.25rem; color: #67e8f9; }
    .room-meta { font-size: 0.85rem; color: var(--muted); }
    .room-body { padding: 0 18px 18px; display: none; }
    .room.open .room-body { display: block; }
    .condition { margin: 12px 0; }
    .condition textarea {
      width: 100%;
      min-height: 60px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      resize: vertical;
    }
    .update {
      background: #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 6px solid #64748b;
    }
    .update.A { border-left-color: #dc2626; }
    .update.B { border-left-color: #ea580c; }
    .update.C { border-left-color: #64748b; }
    .update.done { opacity: 0.55; }
    .update-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .update-name { flex: 1 1 180px; font-weight: 500; font-size: 1.05rem; }
    .update-name input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 500;
      padding: 4px 0;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, input[type="text"], input[type="number"] {
      background: #475569;
      color: var(--text);
      border: 1px solid #64748b;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }
    .empty { color: var(--muted); font-style: italic; text-align: center; padding: 16px; }
    .footer-links { max-width: 720px; margin: 30px auto 0; text-align: center; font-size: 0.9rem; }
    .footer-links a { color: #67e8f9; margin: 0 10px; }
    #sync-status { display: block; margin-top: 6px; font-size: 0.82rem; color: #67e8f9; opacity: 0.85; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
</head>
<body>
  <h1>Room-by-Room Sale Prep</h1>
  <p class="subtitle">Leisure World apartment • Highest-ROI updates<span id="sync-status">Connecting…</span></p>
  <div class="top-bar">
    <button class="btn" onclick="addRoom()">+ Add Room</button>
    <button class="btn btn-secondary" onclick="exportData()">Export Backup</button>
    <button class="btn btn-secondary" onclick="expandAll()">Expand All</button>
  </div>
  <div class="summary" id="summary">
    <div><strong id="total-updates">0</strong><span>Total Updates</span></div>
    <div><strong id="a-count">0</strong><span>Priority A</span></div>
    <div><strong id="done-count">0</strong><span>Done</span></div>
  </div>
  <div id="rooms"></div>
  <div class="footer-links">
    <a href="index.html">← Tools Home</a>
    <a href="NC_Move_Sale_Prep_Costs.html">Sale-Prep Costs</a>
    <a href="NC_Move_Task_Tracker_v5.html">Task Tracker</a>
  </div>
  <script src="room-prep-app.js"></script>
</body>
</html>
